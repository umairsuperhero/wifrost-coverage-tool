steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/wifrost-api:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/wifrost-api:$COMMIT_SHA']

  # Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wifrost-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wifrost-api:$COMMIT_SHA'
      - '--region'
      - 'northamerica-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Real SRTM terrain + ESA WorldCover (rasterio/GDAL) plus the grid's 3D
      # profile arrays peak well above the 512 MiB default — 512 MiB OOM-killed
      # the container (503 "error loading simulation"). Pin 2 GiB so redeploys
      # keep it. Long timeout covers cold-start + first uncached data fetch.
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '120'

images:
  - 'gcr.io/$PROJECT_ID/wifrost-api:$COMMIT_SHA'
